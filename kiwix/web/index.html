<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiwix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Kiwix</h1>
        <p class="muted" id="status"></p>
      </div>
      <div class="header-actions">
        <a class="button primary" id="open" href="#" hidden></a>
        <a class="small-link" id="direct" href="#" target="_blank" rel="noopener" hidden></a>
      </div>
    </header>

    <section id="downloads-section" hidden>
      <h2 data-i18n="downloading"></h2>
      <ul class="list" id="downloads"></ul>
    </section>

    <section>
      <h2 data-i18n="library"></h2>
      <ul class="list" id="library"></ul>
      <p class="muted" id="library-empty" data-i18n="libraryEmpty" hidden></p>
    </section>

    <section>
      <h2 data-i18n="catalog"></h2>
      <form id="search">
        <input type="search" id="q" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
        <select id="lang" aria-label="Language"></select>
        <select id="category" aria-label="Category"></select>
        <button class="button primary" type="submit" data-i18n="search"></button>
      </form>
      <ul class="list" id="results"></ul>
      <p class="muted" id="results-message"></p>
      <button class="button" id="more" hidden data-i18n="more"></button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
